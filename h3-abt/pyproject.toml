[project]
name = "h3-abt"
version = "0.1.0"
description = "H3 experimental protocol and simulation scaffold (no results claimed)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
